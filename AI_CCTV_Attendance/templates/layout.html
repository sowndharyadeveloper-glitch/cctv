<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CCTV Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="page-shell">
        <aside class="sidebar">
            <div class="brand-box">
                <h4>AI CCTV</h4>
                <small>Attendance System</small>
            </div>
            <nav class="nav flex-column mt-4">
                <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('students') }}">Students</a>
                <a class="nav-link" href="{{ url_for('register_student') }}">Register</a>
                <a class="nav-link" href="{{ url_for('live_camera') }}">Live Camera</a>
                <a class="nav-link" href="{{ url_for('monitoring') }}">Monitoring</a>
                <a class="nav-link" href="{{ url_for('alerts') }}">Alerts</a>
                <a class="nav-link" href="{{ url_for('zones') }}">Zones</a>
                <a class="nav-link" href="{{ url_for('cameras') }}">Cameras</a>
                <a class="nav-link" href="{{ url_for('attendance_page') }}">Attendance</a>
                <a class="nav-link" href="{{ url_for('reports') }}">Reports</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </nav>
        </aside>

        <main class="content-area">
            <div class="topbar">
                <span class="fw-semibold">Faculty Panel</span>
                <span class="text-muted">{{ session.get('user', 'Admin') }}</span>
            </div>
            <div class="p-4">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
