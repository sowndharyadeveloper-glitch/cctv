services:
  - type: web
    name: present-sir-api
    runtime: python
    rootDir: AI_CCTV_Attendance
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 app:app
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: database/attendance.db
      - key: CORS_ORIGINS
        value: https://present-sir-rouge.vercel.app
      - key: FRONTEND_URL
        value: https://present-sir-rouge.vercel.app
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: None
